<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- DagaWASD: icona per la scheda dell'Extension Warehouse.
       Quattro tasti W A S D in rilievo su un pavimento a griglia che fugge
       verso l'orizzonte: camminare dentro un modello 3D. -->
  <defs>
    <clipPath id="tondo"><rect x="16" y="16" width="480" height="480" rx="96"/></clipPath>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f7fc0"/>
      <stop offset="1" stop-color="#a9d2f2"/>
    </linearGradient>
    <linearGradient id="suolo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3e57"/>
      <stop offset="1" stop-color="#101a28"/>
    </linearGradient>
    <linearGradient id="cima" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <linearGradient id="fianco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3b2"/>
      <stop offset="1" stop-color="#6b7486"/>
    </linearGradient>
    <radialGradient id="ombra" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <!-- un tasto: centro in (0,0), 100 × 92 in cima, fianco alto 20 -->
    <g id="tasto">
      <ellipse cx="0" cy="40" rx="64" ry="18" fill="url(#ombra)"/>
      <rect x="-50" y="-36" width="100" height="92" rx="16" fill="url(#fianco)" stroke="#3a4250" stroke-width="3"/>
      <rect x="-50" y="-46" width="100" height="82" rx="16" fill="url(#cima)" stroke="#3a4250" stroke-width="3"/>
      <rect x="-40" y="-40" width="80" height="18" rx="9" fill="#ffffff" opacity="0.7"/>
    </g>
  </defs>

  <g clip-path="url(#tondo)">
    <rect x="0" y="0" width="512" height="200" fill="url(#cielo)"/>
    <rect x="0" y="200" width="512" height="312" fill="url(#suolo)"/>
    <!-- griglia in prospettiva: punto di fuga al centro dell'orizzonte -->
    <g stroke="#6fb3ff" stroke-width="2.5" opacity="0.55" fill="none">
      <path d="M256 200 L-540 512 M256 200 L-280 512 M256 200 L-60 512 M256 200 L130 512 M256 200 L256 512 M256 200 L382 512 M256 200 L572 512 M256 200 L792 512 M256 200 L1052 512"/>
      <path d="M0 207 H512 M0 218 H512 M0 234 H512 M0 257 H512 M0 290 H512 M0 337 H512 M0 404 H512 M0 500 H512"/>
    </g>
    <rect x="0" y="196" width="512" height="8" fill="#ffffff" opacity="0.25"/>
  </g>

  <!-- tasti: la fila davanti più grande, come più vicina -->
  <g font-family="Segoe UI Black, Arial Black, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#d6373b">
    <g transform="translate(256 262) scale(0.86)">
      <use href="#tasto"/><text x="0" y="16" font-size="62">W</text>
    </g>
    <g transform="translate(130 384)">
      <use href="#tasto"/><text x="0" y="16" font-size="62">A</text>
    </g>
    <g transform="translate(256 384)">
      <use href="#tasto"/><text x="0" y="16" font-size="62">S</text>
    </g>
    <g transform="translate(382 384)">
      <use href="#tasto"/><text x="0" y="16" font-size="62">D</text>
    </g>
  </g>

  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#0b1320" stroke-opacity="0.35" stroke-width="4"/>
</svg>
