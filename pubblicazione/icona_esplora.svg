<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- DagaWASD: icona dell'esploratore autonomo (si rende a 24 e 32 pixel con tools/rendi_icone).
       Un occhio che guarda il punto più significativo, sopra la stessa striscia di
       pavimento della camminata, con le tappe del cammino verso quel punto. -->
  <defs>
    <linearGradient id="suolo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8fd6" stop-opacity="0"/>
      <stop offset="1" stop-color="#2f6db3" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- pavimento in prospettiva, come nell'icona della camminata -->
  <path d="M14 33 L50 33 L64 63 L0 63 Z" fill="url(#suolo)"/>
  <!-- tappe del cammino, sempre più piccole verso il punto -->
  <g fill="#ffffff" stroke="#2f3540" stroke-width="1">
    <circle cx="20" cy="56" r="4"/>
    <circle cx="29" cy="47.5" r="3.1"/>
    <circle cx="36.5" cy="41" r="2.4"/>
  </g>
  <!-- il punto più significativo -->
  <circle cx="45.5" cy="36.5" r="5.2" fill="none" stroke="#ffd166" stroke-width="2.6"/>
  <circle cx="45.5" cy="36.5" r="1.9" fill="#ffd166"/>
  <!-- l'occhio, con l'iride girata verso il punto -->
  <path d="M3 17 Q32 -6 61 17 Q32 40 3 17 Z" fill="#f6f7f9" stroke="#2f3540" stroke-width="2.6" stroke-linejoin="round"/>
  <circle cx="38" cy="18.5" r="9.5" fill="#00c9a7" stroke="#2f3540" stroke-width="1.8"/>
  <circle cx="39.6" cy="20" r="4.6" fill="#1d2129"/>
  <circle cx="35.6" cy="15.2" r="2.2" fill="#ffffff"/>
</svg>
