<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>DagaWASD</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   COLORI E MISURE — tutto passa da queste variabili, che applyLook()
   ricalcola da Sistema › Aspetto (tema, accento, carattere…). I valori
   qui sotto sono il tema scuro predefinito: valgono finché Ruby non
   manda le impostazioni. Neutri: --bg sfondo … --hi testo più chiaro;
   --s* superfici, --l* bordi, --m* testi smorzati, --t* testi.
═══════════════════════════════════════════════════════════════ */
:root{
  --bg:#151515;--sunk:#111;--s1:#1a1a1a;--s2:#1e1e1e;--s3:#232323;--s4:#2a2a2a;--s5:#333;
  --l1:#262626;--l2:#333;--l3:#3a3a3a;--l4:#4d4d4d;
  --m3:#5d5d5d;--m2:#6a6a6a;--m1:#8a8a8a;--m0:#9a9a9a;--t2:#bbb;--t1:#d0d0d0;--t0:#dcdcdc;--hi:#f0f0f0;
  --edge:rgba(255,255,255,.14);
  --acc:#00c9a7;--acc-hi:#00dbb8;--acc-ink:#0d0d0d;--acc-bg:#10352f;--acc-deep:#0b7f6c;--acc-tx:#00c9a7;--acc-tx2:#00a88c;--knob:#fff;
  --hl:#ffd166;--hl-tx:#ffd166;--hl-ink:#111;--hl-soft:rgba(255,209,102,.09);--hl-line:rgba(255,209,102,.45);
  --hl-bg:#2d2717;--hl-bg2:#3a3218;--hl-edge:#6b5520;
  --dg:#c04747;--dg-hi:#d15656;--dg-ink:#fff;--dg-bg:#3a1f1f;--dg-tx:#ff8080;--dg-edge:#8a3a3a;
  --font:'Segoe UI',system-ui,sans-serif;--fs:15px;--lh:1.55;
  --rk:1;--sp:1;--lblw:230px;--sbw:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--fs)}
html,body{height:100%}
body{
  background:var(--bg);color:var(--t0);
  font:1rem/var(--lh) var(--font);
  user-select:none;
  display:flex;flex-direction:column;
  overflow:hidden;
}
::-webkit-scrollbar{width:var(--sbw);height:var(--sbw)}
::-webkit-scrollbar-track{background:var(--sunk)}
::-webkit-scrollbar-thumb{background:var(--l3);border-radius:calc(5px*var(--rk))}
::-webkit-scrollbar-thumb:hover{background:var(--l4)}
/* Animazioni spente (Aspetto › Animazioni) */
body.noanim *,body.noanim *::before,body.noanim *::after{transition:none!important}
body.noanim .btn:active{transform:none}
/* Descrizioni brevi nascoste (Aspetto › Mostra le descrizioni) */
body.nohints .row .lbl .hint{display:none}

/* ══ TOP BAR ══ */
.bar{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--l1);background:var(--s1);flex:0 0 auto;
  flex-wrap:wrap;
}
.bar h1{font-size:1.133rem;font-weight:700;color:var(--acc-tx);letter-spacing:.3px;white-space:nowrap}
.bar h1 .logo:empty{display:none}
.bar .right{display:flex;align-items:center;gap:12px}
.dot{font-size:.933rem;color:var(--m3);white-space:nowrap}
.dot.on{color:var(--acc-tx);font-weight:600}

/* ══ BUTTONS ══ */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 20px;border:none;border-radius:calc(6px*var(--rk));
  cursor:pointer;font:600 1rem var(--font);
  transition:background .12s,transform .06s;outline:none;
}
.btn:active{transform:scale(.97)}
.btn-go  {background:var(--acc);color:var(--acc-ink)}
.btn-go:hover{background:var(--acc-hi)}
.btn-stop{background:var(--dg);color:var(--dg-ink)}
.btn-stop:hover{background:var(--dg-hi)}
.btn-sm  {background:var(--s4);color:var(--t2);font-size:.933rem;padding:8px 16px}
.btn-sm:hover{background:var(--s5)}

/* ══ TAB LIVELLO 1 ══ */
.tabs1{
  display:flex;gap:4px;padding:8px 12px 0;background:var(--s1);
  border-bottom:1px solid var(--l1);flex:0 0 auto;flex-wrap:wrap;
}
.tabs1 button{
  background:transparent;border:none;border-bottom:3px solid transparent;
  color:var(--m1);cursor:pointer;outline:none;
  font:600 1.067rem var(--font);
  padding:10px 18px 9px;border-radius:calc(6px*var(--rk)) calc(6px*var(--rk)) 0 0;
  transition:color .12s,background .12s,border-color .12s;
}
.tabs1 button:hover{color:var(--t1);background:var(--s3)}
.tabs1 button.act{color:var(--acc-tx);border-bottom-color:var(--acc);background:var(--s3)}

/* ══ TAB LIVELLO 2 (sotto-TAB) ══ */
.tabs2{
  display:flex;gap:6px;padding:10px 16px;background:var(--s1);
  border-bottom:1px solid var(--l1);flex:0 0 auto;flex-wrap:wrap;
}
.tabs2 button{
  background:var(--s3);border:1px solid var(--l2);color:var(--m0);
  cursor:pointer;outline:none;border-radius:calc(20px*var(--rk));
  font:600 .933rem var(--font);padding:6px 16px;
  transition:all .12s;
}
.tabs2 button:hover{background:var(--s4);color:var(--t1)}
.tabs2 button.act{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* ══ ICONE DEI TAB (Aspetto › Icone dei tab) ══ */
.ti svg{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.ti-text .ti{display:none}
body.ti-both .ti{margin-inline-end:7px}
body.ti-icons .tl{display:none}
body.ti-icons .tabs1 button{padding-inline:14px}
body.ti-icons .tabs2 button{padding-inline:11px}

/* ══ CONTENUTO ══ */
.content{flex:1 1 auto;overflow-y:auto;padding:calc(16px*var(--sp)) 18px calc(20px*var(--sp))}
.pane{display:none}
.pane.act{display:block}

.grp{margin-bottom:calc(22px*var(--sp))}
.grp > h3{
  font-size:.867rem;text-transform:uppercase;letter-spacing:1.4px;
  color:var(--m3);margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid var(--l1);
}

/* ══ RIGA IMPOSTAZIONE ══ */
.row{
  display:flex;align-items:center;gap:12px;
  padding:calc(7px*var(--sp)) 10px;border-radius:calc(6px*var(--rk));
}
.row:hover{background:var(--s2)}
.row.off{opacity:.45}
.row .lbl{flex:0 0 var(--lblw);min-width:0}
.row .lbl .name{
  font-size:1rem;color:var(--t1);display:block;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row .lbl .hint{font-size:.833rem;color:var(--m2);display:block;line-height:1.35;margin-top:1px}
.row input[type=range]{
  flex:1 1 auto;min-width:80px;height:6px;
  accent-color:var(--acc);cursor:pointer;
  -webkit-appearance:none;background:transparent;
}
.row input[type=range]::-webkit-slider-runnable-track{
  height:6px;background:var(--s5);border-radius:calc(3px*var(--rk));
}
.row input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;
  background:var(--acc);border-radius:50%;margin-top:-6px;cursor:pointer;
  box-shadow:0 0 0 1px var(--sunk);
}
.nbox{
  flex:0 0 86px;width:86px;background:var(--s3);border:1px solid var(--l2);
  color:var(--hi);padding:6px 8px;border-radius:calc(5px*var(--rk));
  font:1rem var(--font);text-align:right;outline:none;
}
.nbox:focus{border-color:var(--acc);background:var(--s4)}
.unit{flex:0 0 44px;font-size:.867rem;color:var(--m2);white-space:nowrap;unicode-bidi:plaintext}  /* in arabo «°/s» resta °/s, non s/° */

/* ══ COLORE E SCELTA ══ */
.cpick{
  flex:0 0 46px;width:46px;height:32px;padding:2px;margin-inline-start:auto;cursor:pointer;
  background:var(--s3);border:1px solid var(--l2);border-radius:calc(5px*var(--rk));outline:none;
}
.cpick:focus{border-color:var(--acc)}
.cpick::-webkit-color-swatch-wrapper{padding:0}
.cpick::-webkit-color-swatch{border:none;border-radius:calc(3px*var(--rk))}
.nbox.hex{text-align:left;direction:ltr;font-family:Consolas,'Cascadia Mono',monospace;font-size:.933rem;user-select:text}
.nbox.hex.bad{border-color:var(--dg-edge)}
.sel{
  flex:1 1 auto;min-width:0;max-width:320px;margin-inline-start:auto;
  background:var(--s3);border:1px solid var(--l2);color:var(--hi);
  padding:6px 8px;border-radius:calc(5px*var(--rk));font:1rem var(--font);outline:none;cursor:pointer;
}
.sel:focus{border-color:var(--acc)}
.sel option{background:var(--s2);color:var(--t0)}

/* ══ ANTEPRIMA MIRINO ══ */
.hudprev{
  position:relative;height:120px;margin:4px 10px 14px;border-radius:calc(8px*var(--rk));overflow:hidden;
  background:linear-gradient(100deg,#e9edf2 0%,#c9d2dc 34%,#6d7885 58%,#2b3139 100%);
  box-shadow:inset 0 0 0 1px var(--l2);
}
.hudprev svg{position:absolute;inset:0;width:100%;height:100%}
.hudprev .cap{
  position:absolute;inset-inline-start:10px;bottom:7px;font-size:.767rem;color:#222;
  background:rgba(255,255,255,.6);padding:1px 7px;border-radius:calc(8px*var(--rk));
}

/* ══ STATO DEL PONTE PER CLAUDE ══ */
.bstat{margin:4px 10px;font-size:.933rem;color:var(--m1)}
.bstat.on{color:var(--acc-tx);font-weight:600}
.bstat .smeta{display:block;font-weight:400;color:var(--m1);margin-top:2px}
.wpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:4px 10px 10px}
.wp{display:flex;flex-direction:column;gap:3px;text-align:left;padding:10px 12px;cursor:pointer;
  background:var(--s2);border:1px solid var(--l2);border-radius:calc(6px*var(--rk));color:var(--t1);font:inherit}
.wp:hover{border-color:var(--acc);background:var(--s3)}
.wp b{font-weight:600}
.wp span{font-size:.867rem;color:var(--m1);line-height:1.35}

/* ══ PERCORSI ══ */
.plist{margin:4px 10px 12px;display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--s2);
  border:1px solid var(--l2);border-radius:calc(6px*var(--rk))}
.prow .pn{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.prow .pd{font-size:.867rem;color:var(--m1);white-space:nowrap}
.prow button{background:var(--s4);color:var(--t2);border:none;border-radius:calc(5px*var(--rk));
  padding:5px 9px;cursor:pointer;font:inherit;font-size:.933rem}
.prow button:hover{background:var(--s5)}
.prow button.pgo{background:var(--acc);color:var(--acc-ink)}
.pempty{margin:4px 10px 12px;color:var(--m1);font-size:.933rem}

/* ══ TOGGLE ══ */
.sw{position:relative;width:50px;height:27px;flex:0 0 auto;margin-left:auto}
.sw input{opacity:0;width:0;height:0}
.knob{position:absolute;cursor:pointer;inset:0;background:var(--s5);border-radius:27px;transition:.18s}
.knob::before{
  content:'';position:absolute;width:20px;height:20px;left:4px;top:3.5px;
  background:var(--m2);border-radius:50%;transition:.18s;
}
input:checked+.knob{background:var(--acc)}
input:checked+.knob::before{transform:translateX(22px);background:var(--knob)}

/* ══ LEGENDA COMANDI ══ */
table.keys{width:100%;border-collapse:collapse;font-size:1rem}
table.keys td{padding:calc(8px*var(--sp)) 10px;border-bottom:1px solid var(--l1)}
table.keys td:first-child{width:180px}
table.keys kbd{
  display:inline-block;background:var(--s4);border:1px solid var(--l3);
  border-bottom-width:2px;border-radius:calc(5px*var(--rk));padding:3px 10px;
  font:600 .933rem var(--font);color:var(--acc-tx);
}
table.keys td:last-child{color:var(--t2)}

.note{
  font-size:.9rem;color:var(--m1);line-height:1.6;
  background:var(--s2);border-left:3px solid var(--acc);
  padding:10px 14px;border-radius:0 calc(5px*var(--rk)) calc(5px*var(--rk)) 0;margin-bottom:18px;
}
.note b{color:var(--t2)}

/* ══ SELEZIONE LINGUA ══ */
.langgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.langgrid button{
  display:flex;align-items:center;gap:11px;text-align:left;
  background:var(--s2);border:1px solid var(--l2);color:var(--t1);
  border-radius:calc(7px*var(--rk));padding:9px 12px;cursor:pointer;outline:none;
  font:1rem var(--font);transition:all .12s;
}
.langgrid button:hover{background:var(--s4);border-color:var(--l3);color:var(--hi)}
.langgrid button.act{background:var(--acc-bg);border-color:var(--acc);color:var(--hi);font-weight:600}
.langgrid svg{flex:0 0 auto;display:block;border-radius:2px;box-shadow:0 0 0 1px var(--edge)}
.langgrid .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.langgrid .chk{color:var(--acc-tx);font-weight:700}
.auto-ico{
  flex:0 0 auto;width:24px;height:16px;border-radius:2px;
  background:linear-gradient(135deg,var(--acc),var(--acc-deep));
  box-shadow:0 0 0 1px var(--edge);
}

/* ══ TABELLA MATERIALI ══ */
.mwrap{overflow-x:auto}
table.mat{width:100%;border-collapse:collapse;font-size:.933rem}
table.mat th{
  font-size:.767rem;text-transform:uppercase;letter-spacing:.8px;color:var(--m3);
  font-weight:600;text-align:left;padding:4px 5px 8px;border-bottom:1px solid var(--l1);white-space:nowrap;
}
table.mat td{padding:5px;border-bottom:1px solid var(--l1);vertical-align:middle}
table.mat tr:hover td{background:var(--s2)}
table.mat input{
  width:100%;background:var(--s3);border:1px solid var(--l2);color:var(--hi);
  padding:5px 7px;border-radius:calc(5px*var(--rk));font:.933rem var(--font);outline:none;
}
table.mat input:focus{border-color:var(--acc);background:var(--s4)}
table.mat input.mnum{width:62px;text-align:right}
table.mat .bname{color:var(--t1);white-space:nowrap}
.mico,.mdel{
  background:var(--s2);border:1px solid var(--l2);border-radius:calc(6px*var(--rk));cursor:pointer;
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;outline:none;
}
.mico:hover{border-color:var(--acc)}
.mdel{color:var(--m1);font-size:.933rem}
.mdel:hover{background:var(--dg-bg);border-color:var(--dg);color:var(--dg-tx)}
.mbtns{display:flex;gap:10px;margin-top:12px}
body.rtl table.mat th{text-align:right}

/* ══ RICERCA ══ */
.srch{
  margin-inline-start:auto;align-self:center;position:relative;
  display:flex;align-items:center;margin-bottom:6px;
}
.srch .ico{position:absolute;inset-inline-start:10px;color:var(--m2);font-size:1.067rem;pointer-events:none}
.srch input{
  width:210px;background:var(--s3);border:1px solid var(--l2);color:var(--hi);
  padding:6px 44px 6px 30px;border-radius:calc(16px*var(--rk));font:.933rem var(--font);outline:none;
  user-select:text;
}
body.rtl .srch input{padding:6px 30px 6px 44px}
.srch input:focus{border-color:var(--acc);background:var(--s4)}
.srch input.none{border-color:var(--dg-edge)}
.srch .cnt{position:absolute;inset-inline-end:12px;font-size:.8rem;color:var(--hl-tx);pointer-events:none}
.tabs1 button.hit,.tabs2 button.hit{color:var(--hl-tx);box-shadow:inset 0 0 0 1px var(--hl-line)}
.tabs1 button.hit.act{border-bottom-color:var(--hl)}
.tabs2 button.hit.act{background:var(--hl);border-color:var(--hl);color:var(--hl-ink)}
.tabs1 button[data-n]::after,.tabs2 button[data-n]::after{
  content:attr(data-n);margin-inline-start:7px;font-size:.733rem;font-weight:700;
  background:var(--hl);color:var(--hl-ink);border-radius:9px;padding:1px 6px;vertical-align:1px;
}
.row.hit,table.keys tr.hit td,table.mat tr.hit td,.langgrid button.hit{
  background:var(--hl-soft);
}
.row.hit{box-shadow:inset 3px 0 0 var(--hl)}
body.rtl .row.hit{box-shadow:inset -3px 0 0 var(--hl)}
.langgrid button.hit{border-color:var(--hl)}
mark{background:var(--hl);color:var(--hl-ink);border-radius:2px;padding:0 1px}

/* ══ VALORI MODIFICATI ══ */
.row.mod .lbl .name::before{
  content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
  background:var(--acc);margin-inline-end:7px;vertical-align:1px;
}
.rst{
  flex:0 0 26px;width:26px;height:26px;border-radius:calc(5px*var(--rk));border:1px solid transparent;
  background:transparent;color:var(--acc-tx);font-size:1rem;cursor:pointer;outline:none;
  visibility:hidden;
}
.row.mod .rst{visibility:visible}
.rst:hover,.rst:focus-visible{background:var(--acc-bg);border-color:var(--acc)}
.lvsw button.mod::after{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--acc);margin-inline-start:6px;vertical-align:2px;
}
.lvsw button.act.mod::after{background:var(--acc-ink)}

/* ══ TASTI PERSONALIZZABILI ══ */
.kb{
  display:inline-block;min-width:34px;background:var(--s4);border:1px solid var(--l3);
  border-bottom-width:2px;border-radius:calc(5px*var(--rk));padding:3px 10px;cursor:pointer;outline:none;
  font:600 .933rem var(--font);color:var(--acc-tx);transition:border-color .12s,background .12s;
}
.kb:hover,.kb:focus-visible{border-color:var(--acc);background:var(--s5)}
.kb.mod{background:var(--acc-bg)}
.kb.wait{color:var(--hl-tx);border-color:var(--hl);background:var(--hl-bg)}

/* ══ LIVELLO DI DETTAGLIO ══ */
.lvsw{
  display:flex;background:var(--s3);border:1px solid var(--l2);border-radius:calc(18px*var(--rk));padding:3px;gap:2px;
  min-width:0;
}
.lvsw button{
  background:transparent;border:none;color:var(--m1);cursor:pointer;outline:none;
  font:600 .9rem var(--font);padding:5px 13px;border-radius:calc(15px*var(--rk));white-space:nowrap;
  transition:background .12s,color .12s;
}
.lvsw button:hover{color:var(--t1);background:var(--s4)}
.lvsw button.act{background:var(--acc);color:var(--acc-ink)}
/* elementi sopra il livello scelto: nascosti (e ignorati dalla ricerca) */
body[data-lv="1"] [data-lv="2"],body[data-lv="1"] [data-lv="3"],
body[data-lv="2"] [data-lv="3"]{display:none!important}

/* ══ GUIDA ("?") ══ */
.btn-help{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--l3);background:var(--s3);
  color:var(--t2);font:700 1.067rem var(--font);cursor:pointer;outline:none;flex:0 0 auto;
  transition:all .12s;
}
.btn-help:hover,.btn-help:focus-visible{border-color:var(--acc);color:var(--acc-tx)}
.modal{
  position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;padding:16px;
}
.modal.open{display:flex}
.modal .card{
  position:relative;background:var(--s2);border:1px solid var(--l2);border-radius:calc(10px*var(--rk));
  max-width:540px;width:100%;max-height:100%;overflow-y:auto;padding:20px 22px 18px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);user-select:text;
}
.modal h2{font-size:1.2rem;color:var(--acc-tx);margin:0 30px 8px 0}
.modal p{color:var(--t2);margin-bottom:12px}
.modal ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.modal li{color:var(--t2);font-size:.933rem;padding-inline-start:16px;position:relative}
.modal li::before{content:'';position:absolute;inset-inline-start:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.modal kbd{
  display:inline-block;background:var(--s4);border:1px solid var(--l3);border-bottom-width:2px;
  border-radius:calc(4px*var(--rk));padding:0 6px;margin:0 1px;font:600 .833rem var(--font);color:var(--acc-tx);
}
.modal .x{
  position:absolute;top:12px;inset-inline-end:12px;width:30px;height:30px;border-radius:calc(6px*var(--rk));
  background:transparent;border:none;color:var(--m1);font-size:1.2rem;cursor:pointer;outline:none;
}
.modal .x:hover,.modal .x:focus-visible{background:var(--s4);color:var(--hi)}
body.rtl .modal h2{margin:0 0 8px 30px}

/* ══ REGISTRO ERRORI ══ */
.btn-warn{
  height:32px;border-radius:calc(16px*var(--rk));border:1px solid var(--hl-edge);background:var(--hl-bg);
  color:var(--hl-tx);font:700 .9rem var(--font);padding:0 12px;cursor:pointer;outline:none;
  flex:0 0 auto;
}
.btn-warn:hover,.btn-warn:focus-visible{border-color:var(--hl);background:var(--hl-bg2)}
.btn-warn[hidden]{display:none}
.modal .card.wide{max-width:780px}
.logpath{font-size:.8rem;color:var(--m2);margin-bottom:8px;word-break:break-all;user-select:text}
.logpre{
  background:var(--sunk);border:1px solid var(--l1);border-radius:calc(6px*var(--rk));padding:10px 12px;
  font:.833rem/1.45 Consolas,'Cascadia Mono',monospace;color:var(--t1);
  white-space:pre-wrap;word-break:break-word;max-height:55vh;min-height:120px;overflow:auto;
  user-select:text;
}
.logpre.empty{color:var(--m2);font-family:var(--font);font-size:.933rem}
.logpre .ts{color:var(--hl-tx)}
.modal .mbtns{flex-wrap:wrap}

/* ══ FOOTER ══ */
.foot{
  display:flex;gap:10px;justify-content:flex-end;align-items:center;
  padding:11px 16px;border-top:1px solid var(--l1);background:var(--s1);flex:0 0 auto;
}
.foot .status{
  margin-inline-end:auto;flex:1 1 auto;min-width:0;
  font-size:.833rem;line-height:1.35;color:var(--m3);
  height:4.05em;overflow:hidden;display:flex;flex-direction:column;justify-content:center;
}
/* spiegazione dell'impostazione sotto il mouse (altezza fissa: niente salti) */
.foot .status.info{color:var(--m0);display:block;overflow-y:auto}
.foot .status b{color:var(--t1);font-weight:600}
.foot .status .meta{display:block;color:var(--acc-tx2);margin-top:2px}
.foot .status.flash{color:var(--hl-tx)}

/* ══ RTL ══ */
body.rtl{direction:rtl}
body.rtl .row .lbl .name,body.rtl .row .lbl .hint{text-align:right}
body.rtl .langgrid button{text-align:right}
body.rtl table.keys td{text-align:right}
body.rtl .note{border-left:none;border-right:3px solid var(--acc);border-radius:calc(5px*var(--rk)) 0 0 calc(5px*var(--rk))}
</style>

<div class="tabs2" id="tabs2"></div>

/* ═══════════════════════════════════════════════════════════════
   BANDIERE — SVG inline 24×16.
   Su Windows le emoji bandiera non hanno glifo (escono come "IT",
   "FR"…), quindi vanno disegnate. Le forme sono semplificate:
   servono a riconoscere la lingua a colpo d'occhio, non a essere
   riproduzioni araldiche.
═══════════════════════════════════════════════════════════════ */
function sv(inner){
  return `<svg width="24" height="16" viewBox="0 0 24 16">${inner}</svg>`;
}
function bands(cols, vert){           // strisce uguali
  const n = cols.length, s = (vert ? 24 : 16) / n;
  return sv(cols.map((c, i) => vert
    ? `<rect x="${i*s}" y="0" width="${s}" height="16" fill="${c}"/>`
    : `<rect x="0" y="${i*s}" width="24" height="${s}" fill="${c}"/>`).join(''));
}
function wband(parts){                // strisce orizzontali pesate [colore,peso]
  const tot = parts.reduce((a, p) => a + p[1], 0);
  let y = 0;
  return sv(parts.map(p => {
    const h = 16 * p[1] / tot, r = `<rect x="0" y="${y}" width="24" height="${h}" fill="${p[0]}"/>`;
    y += h; return r;
  }).join(''));
}
function nordic(bg, cr, inner){       // croce scandinava
  let s = `<rect width="24" height="16" fill="${bg}"/>`
        + `<rect x="6" y="0" width="4" height="16" fill="${cr}"/>`
        + `<rect x="0" y="6" width="24" height="4" fill="${cr}"/>`;
  if(inner) s += `<rect x="7" y="0" width="2" height="16" fill="${inner}"/>`
              +  `<rect x="0" y="7" width="24" height="2" fill="${inner}"/>`;
  return sv(s);
}
function star(cx, cy, r, fill, rot){  // stella a 5 punte
  let p = '';
  for(let i = 0; i < 10; i++){
    const a = (rot || -90) * Math.PI/180 + i * Math.PI/5;
    const rr = i % 2 ? r * 0.382 : r;
    p += (i ? 'L' : 'M') + (cx + rr*Math.cos(a)).toFixed(2) + ' ' + (cy + rr*Math.sin(a)).toFixed(2);
  }
  return `<path d="${p}Z" fill="${fill}"/>`;
}

const FIELDS = {};

  g.fields.forEach(f => { FIELDS[f.k] = f; }))));
const NUM_KEYS  = Object.keys(FIELDS).filter(k => !FIELDS[k].type);
const BOOL_KEYS = Object.keys(FIELDS).filter(k => FIELDS[k].type === 'bool');
const STR_KEYS  = Object.keys(FIELDS).filter(k => FIELDS[k].type === 'color' || FIELDS[k].type === 'choice');
/* valori di una scelta: prima quelli con nome fisso (lit), poi i tradotti (opts) */
function choiceVals(f){ return Object.keys(f.lit || {}).concat(f.opts || []); }
function choiceLabel(f, v){ return f.lit && f.lit[v] !== undefined ? f.lit[v] : T('o.' + f.k + '.' + v); }
/* campi dell'Aspetto (quelli che applyLook trasforma in CSS o nell'anteprima) */
const LOOK_KEYS = Object.keys(FIELDS).filter(k => /^(ui|hud)_/.test(k));

/* ═══ Livelli di dettaglio ═══
   Ogni contenitore prende il livello minimo dei suoi figli: un gruppo,
   sotto-tab o tab compare appena almeno uno dei suoi campi è visibile.
   Nascondere è compito del CSS (body[data-lv] + [data-lv]); i campi
   nascosti restano nel DOM, quindi conservano e salvano il loro valore. */
const LEVELS = [1, 2, 3];
let LEVEL = 1;
SPEC.forEach(t => {
  t.subs.forEach(s => {
    (s.groups || []).forEach(g => {
      g.fields.forEach(f => { f.lv = f.lv || 1; });
      g.lv = Math.min(...g.fields.map(f => f.lv));
    });
    s.lv = s.groups ? Math.min(...s.groups.map(g => g.lv)) : (s.lv || 1);
  });
  t.lv = Math.min(...t.subs.map(s => s.lv));
});
function shown(x){ return x.lv <= LEVEL; }

/* save = true quando la scelta viene dall'utente (va salvata con le impostazioni) */

  n = LEVELS.includes(+n) ? +n : 1;
  LEVEL = n;
  document.body.dataset.lv = n;
  document.querySelectorAll('#lvsw button').forEach(b =>
    b.classList.toggle('act', +b.dataset.lvl === n));
  try { localStorage.setItem('dagawasd_lvl', n); } catch(e){}

  if(curTab) selTab(curTab);
  runSearch(false);
  markLevelMods();
  if(save) saveNow();
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function fieldHTML(f){
  const hk = 'h.' + f.k;
  const lbl = `<div class="lbl"><span class="name">${esc(T('f.' + f.k))}</span>`
            + (has(hk) ? `<span class="hint">${esc(T(hk))}</span>` : '') + `</div>`;
  const rst = `<button class="rst" title="${escA(T('ui.reset_one'))}" onclick="resetOne('${f.k}')">↺</button>`;
  if(f.type === 'bool'){
    return `<div class="row" data-k="${f.k}" data-lv="${f.lv}">${lbl}
      <label class="sw"><input type="checkbox" id="${f.k}" onchange="live('${f.k}')"><span class="knob"></span></label>
      ${rst}
    </div>`;
  }
  /* Colore: selettore + casella esadecimale (id_v), che resta vuota finché
     Ruby non manda i valori: il selettore da solo direbbe "#000000". */
  if(f.type === 'color'){
    return `<div class="row" data-k="${f.k}" data-lv="${f.lv}">${lbl}
      <input type="color" class="cpick" id="${f.k}" oninput="colorPick('${f.k}')" onchange="saveNow()">
      <input class="nbox hex" id="${f.k}_v" type="text" maxlength="7" autocomplete="off" spellcheck="false"
             oninput="hexIn('${f.k}')" onchange="fixHex('${f.k}')" onblur="fixHex('${f.k}')">
      ${rst}
    </div>`;
  }
  if(f.type === 'preset'){
    const opts = choiceVals(f).map(v => `<option value="${v}">${esc(choiceLabel(f, v))}</option>`).join('');
    return `<div class="row" data-k="${f.k}" data-lv="${f.lv}">${lbl}
      <select class="sel" id="${f.k}" onchange="pickPlace(this.value)">${opts}</select>
      <button class="rst" style="visibility:hidden" tabindex="-1">↺</button>
    </div>`;
  }
  if(f.type === 'choice'){
    const font = f.k === 'ui_font';
    const opts = choiceVals(f).map(v => `<option value="${v}"${font ? ` style="font-family:${escA(FONT_STACK[v])}"` : ''}>${esc(choiceLabel(f, v))}</option>`).join('');
    return `<div class="row" data-k="${f.k}" data-lv="${f.lv}">${lbl}
      <select class="sel" id="${f.k}" onchange="live('${f.k}')">${opts}</select>
      ${rst}
    </div>`;
  }
  return `<div class="row" data-k="${f.k}" data-lv="${f.lv}">${lbl}
    <input type="range" id="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" oninput="sync(this)">
    <input class="nbox" id="${f.k}_v" type="text" inputmode="decimal" autocomplete="off"
           oninput="sb(this,'${f.k}')" onchange="fix('${f.k}')" onblur="fix('${f.k}')">
    <span class="unit">${esc(f.u || '')}</span>
    ${rst}
  </div>`;
}

/* ═══ Tasti personalizzabili ═══
   KEYS: azione → codice VK di Windows (= event.keyCode nel pannello).
   Clic su un tasto → "premi un tasto": il successivo keydown lo assegna;
   se era già di un'altra azione le due si scambiano. Esc annulla.
   KEY_LBL conserva il nome mostrato per i tasti che dipendono dal layout
   (ò, è, +…): Ruby lo usa per la riga di stato. */
const KEY_ACTS = ['forward','back','left','right','jump','crouch','run','use','kick','grab','cursor','record'];
const RESERVED_VK = [27, 9, 33, 34, 36, 37, 38, 39, 40, 91, 92, 93, 98, 100, 102, 104];   // = RESERVED_KEYS in main.rb
const VK_NAMES = {8:'Backspace', 13:'Enter', 16:'Shift', 17:'Ctrl', 18:'Alt', 20:'CapsLock',
                  32:'Space', 35:'End', 36:'Home', 45:'Ins', 46:'Del'};
const MOVE_T = {forward:'keys.fwd', left:'keys.left', back:'keys.back', right:'keys.right'};
let KEYS = {}, KEY_LBL = {}, CAPTURE = null;

function vkName(vk){
  if(VK_NAMES[vk]) return VK_NAMES[vk];
  if((vk >= 48 && vk <= 57) || (vk >= 65 && vk <= 90)) return String.fromCharCode(vk);
  if(vk >= 112 && vk <= 135) return 'F' + (vk - 111);
  if(vk >= 96 && vk <= 105) return 'Num' + (vk - 96);
  return '#' + vk.toString(16).toUpperCase();
}
/* Nome da conservare solo se vkName non basta (tasti di punteggiatura ecc.) */
function eventLabel(e, vk){
  if(VK_NAMES[vk] || (vk >= 48 && vk <= 57) || (vk >= 65 && vk <= 90) || (vk >= 96 && vk <= 135)) return null;
  return e.key && e.key.length === 1 ? e.key.toUpperCase() : null;
}
function keyLabel(a){ return KEY_LBL[a] || (KEYS[a] ? vkName(KEYS[a]) : '…'); }
function keyMod(a){ return !!(DEF.keys && KEYS[a] !== undefined && KEYS[a] !== DEF.keys[a]); }
function setLbl(a, l){ if(l) KEY_LBL[a] = l; else delete KEY_LBL[a]; }

function kbtn(a, title){
  return `<button class="kb${keyMod(a) ? ' mod' : ''}" data-act="${a}" title="${escA(title || T('keys.hint'))}"
    onclick="captureKey('${a}')" onblur="cancelCapture('${a}')">${esc(keyLabel(a))}</button>`;
}

function keyRows(){
  const k = x => `<kbd>${x}</kbd>`;
  return [
    [k('Ctrl') + '+' + k('PgUp'), 'keys.enter'],
    [k('Ctrl') + '+' + k('Home'), 'keys.panel'],
    [['forward','left','back','right'].map(a => kbtn(a, T(MOVE_T[a]))).join(' ')
       + ' / ' + ['↑','←','↓','→'].map(k).join(' '), 'keys.move'],
    [kbtn('run'),    'keys.run'],
    [kbtn('jump'),   'keys.jump'],
    [kbtn('crouch'), 'keys.crouch'],
    [kbtn('use'),    'keys.use'],
    [kbtn('kick'),   'keys.kick'],
    [kbtn('grab'),   'keys.grab'],
    [k('Shift') + '+' + k(esc(keyLabel('grab'))), 'keys.grab_inner'],
    [kbtn('cursor'), 'keys.cursor'],
    [kbtn('record'), 'keys.record'],
    [k('🖱'), 'keys.zoom'],
    [k('ESC') + ' / ' + k('Ctrl') + '+' + k('PgDn'), 'keys.exit'],
  ];
}
function keyTableRows(){
  return keyRows().map(r => `<tr><td>${r[0]}</td><td>${esc(T(r[1]))}</td></tr>`).join('');
}
function keysHTML(){
  return `<div class="note">${T('keys.note')} ${esc(T('keys.hint'))}</div>
    <table class="keys" id="keytable">${keyTableRows()}</table>
    <div class="mbtns"><button class="btn btn-sm" onclick="resetKeys()">${esc(T('keys.reset'))}</button></div>`;
}
/* Ridisegna tutto ciò che mostra i tasti: legenda e guida. */
function renderKeys(){
  const t = document.getElementById('keytable');
  if(t) t.innerHTML = keyTableRows();
  const hb = document.getElementById('helpBody');
  if(hb) hb.innerHTML = helpHTML();
  markLevelMods();
  if(SEARCH_Q) runSearch(false);
}

function captureKey(a){
  if(CAPTURE && CAPTURE !== a) cancelCapture(CAPTURE);
  CAPTURE = a;
  const b = document.querySelector(`.kb[data-act="${a}"]`);
  if(b){ b.classList.add('wait'); b.textContent = T('keys.press'); b.focus(); }
}
function cancelCapture(a){
  if(CAPTURE !== a) return;
  CAPTURE = null;
  renderKeys();
}
document.addEventListener('keydown', e => {
  if(!CAPTURE) return;
  e.preventDefault(); e.stopPropagation();
  const a = CAPTURE, vk = e.keyCode;
  if(vk === 27){ cancelCapture(a); return; }
  if(!vk || RESERVED_VK.includes(vk)){ flashStatus(T('keys.reserved')); return; }   // resta in attesa
  const other = KEY_ACTS.find(x => x !== a && KEYS[x] === vk);
  if(other){ KEYS[other] = KEYS[a]; setLbl(other, KEY_LBL[a]); }
  KEYS[a] = vk; setLbl(a, eventLabel(e, vk));
  CAPTURE = null;          // prima di ridisegnare: il blur del vecchio pulsante non deve annullare
  renderKeys();
  saveNow();
}, true);

function resetKeys(){
  if(!DEF.keys) return;
  KEYS = Object.assign({}, DEF.keys); KEY_LBL = {};
  renderKeys(); saveNow();
}

/* ═══ Tabella materiali ═══
   MATS arriva da Ruby dentro loadSettings (tabella effettiva) e torna
   indietro con collect(). Le righe predefinite hanno id = chiave del
   catalogo e nome tradotto mat.<id>; quelle aggiunte hanno un nome proprio. */
let MATS = [];
const BUILTIN = ['legno','pietra','metallo','vetro','gomma','pallone','cartone','plastica'];
const MICO = {
  wood:   '<rect x="2" y="4" width="16" height="12" rx="2" fill="#a0692e"/><path d="M4 8h12M4 12h9" stroke="#6b421a" stroke-width="1.3"/>',
  stone:  '<path d="M3 13l2-6 5-3 5 2 2 6-4 4H7z" fill="#8a8a8a"/><path d="M8 7l2 4 4 1" stroke="#666" fill="none"/>',
  metal:  '<path d="M10 2l7 4v8l-7 4-7-4V6z" fill="#9aa4ad"/><circle cx="10" cy="10" r="3" fill="#151515"/>',
  glass:  '<rect x="4" y="3" width="12" height="14" rx="1.5" fill="#7fd3f0" fill-opacity=".35" stroke="#9fe0f5"/><path d="M7 6l-1 4M10 5l-2 7" stroke="#e8f8ff" stroke-width="1.2"/>',
  rubber: '<circle cx="10" cy="10" r="8" fill="#262626" stroke="#555"/><circle cx="10" cy="10" r="3.5" fill="#151515" stroke="#777"/>',
  ball:   '<circle cx="10" cy="10" r="8" fill="#eee"/><path d="M10 6l3 2-1 4H8L7 8z" fill="#222"/>',
  box:    '<path d="M3 7l7-3 7 3v8l-7 3-7-3z" fill="#c49a5c"/><path d="M3 7l7 3 7-3M10 10v8" stroke="#8a6534" fill="none"/>',
  plastic:'<path d="M8 2h4v3l2 3v10H6V8l2-3z" fill="#3fa9f5"/>',
  cork:   '<rect x="5" y="3" width="10" height="14" rx="2" fill="#c8a06a"/><g fill="#8e6a3a"><circle cx="8" cy="7" r="1"/><circle cx="12" cy="10" r="1"/><circle cx="9" cy="13" r="1"/></g>',
  ice:    '<path d="M10 2v16M3 6l14 8M17 6L3 14" stroke="#8fe3ff" stroke-width="2" stroke-linecap="round"/>',
  foam:   '<g fill="#f2d25c"><circle cx="7" cy="8" r="4"/><circle cx="13" cy="7" r="3.5"/><circle cx="11" cy="13" r="4.5"/></g>',
  generic:'<circle cx="10" cy="10" r="7" fill="#00c9a7" fill-opacity=".25" stroke="#00c9a7"/>',
};
const MICO_IDS = Object.keys(MICO);
/* colonna → [min, max, decimali] */
const MLIM = { density:[10, 20000, 0], restitution:[0, 0.98, 2], friction:[0, 1.5, 2] };

function escA(s){ return esc(s).replace(/"/g, '&quot;'); }
function micoSVG(id){ return `<svg width="20" height="20" viewBox="0 0 20 20">${MICO[id] || MICO.generic}</svg>`; }
function isBuiltin(r){ return BUILTIN.includes(r.id) && !r.name; }

function matHTML(){
  return `<div class="note">${esc(T('mt.note'))}</div>
    <div class="mwrap"><table class="mat">
      <thead><tr><th></th><th>${esc(T('mt.name'))}</th><th>${esc(T('mt.keywords'))}</th>
        <th>${esc(T('mt.density'))}<br>kg/m³</th><th>${esc(T('mt.bounce'))}<br>0–0.98</th>
        <th>${esc(T('mt.friction'))}<br>μ</th><th></th></tr></thead>
      <tbody id="matbody"></tbody>
    </table></div>
    <div class="mbtns">
      <button class="btn btn-sm" onclick="madd()">+ ${esc(T('mt.add'))}</button>
      <button class="btn btn-sm" onclick="sketchup.reset_materials()">${esc(T('mt.reset'))}</button>
    </div>`;
}

function renderMaterials(){
  const tb = document.getElementById('matbody');
  if(!tb) return;
  tb.innerHTML = MATS.map((r, i) => {
    const nm = isBuiltin(r)
      ? `<span class="bname">${esc(T('mat.' + r.id))}</span>`
      : `<input dir="auto" value="${escA(r.name)}" oninput="mset(${i},'name',this.value)">`;
    const numCell = k => `<td><input class="mnum" value="${(+r[k]).toFixed(MLIM[k][2])}"
        onchange="mnum(${i},'${k}',this)" onblur="mnum(${i},'${k}',this)"></td>`;
    return `<tr>
      <td><button class="mico" title="${escA(T('mt.icon'))}" onclick="micon(${i})">${micoSVG(r.icon)}</button></td>
      <td>${nm}</td>
      <td><input dir="auto" value="${escA(r.keywords)}" oninput="mset(${i},'keywords',this.value)"></td>
      ${numCell('density')}${numCell('restitution')}${numCell('friction')}
      <td><button class="mdel" title="${escA(T('mt.del'))}" onclick="mdel(${i})">✕</button></td>
    </tr>`;
  }).join('');
  if(SEARCH_Q) runSearch(false);
}

function mset(i, k, v){ MATS[i][k] = v; schedule(); }
function mnum(i, k, el){
  const [lo, hi, d] = MLIM[k];
  let v = num(el.value);
  if(v === null) v = MATS[i][k];
  v = Math.min(hi, Math.max(lo, v));
  el.value = v.toFixed(d);
  if(MATS[i][k] !== v){ MATS[i][k] = v; saveNow(); }
}
function micon(i){
  const r = MATS[i];
  r.icon = MICO_IDS[(MICO_IDS.indexOf(r.icon) + 1) % MICO_IDS.length];
  renderMaterials(); saveNow();
}
function madd(){
  MATS.push({ id:'c' + Date.now().toString(36), name:T('mt.new'), density:500,
              restitution:0.3, friction:0.5, keywords:'', icon:'generic' });
  renderMaterials(); saveNow();
}
function mdel(i){ MATS.splice(i, 1); renderMaterials(); saveNow(); }

  setLogCount(LOG_N);

  setSky(SKY);         // idem #skyStatus

  document.getElementById('btnReset').textContent = T('ui.reset');

  STATUS = T('ui.autosave'); renderStatus();
  markLang();

  document.querySelectorAll('#content select.sel').forEach(s => { s.selectedIndex = -1; });
  renderMaterials();   // il DOM è stato ricostruito (anche al cambio lingua)
  refreshModified();
  if(SEARCH_Q) runSearch(false);

let curTab = null, curSub = {};

function selTab(id){
  let tab = SPEC.find(t => t.id === id);
  if(!tab || !shown(tab)) tab = SPEC.find(shown);     // nascosto dal livello scelto
  id = curTab = tab.id;
  document.querySelectorAll('#tabs1 button[data-t]').forEach(b =>
    b.classList.toggle('act', b.dataset.t === id));
  document.getElementById('tabs2').innerHTML = tab.subs.map(s =>
    `<button data-s="${s.id}" data-lv="${s.lv}" title="${escA(T('sub.' + s.id))}" onclick="selSub('${s.id}')">${tabLabel('sub.', s.id)}</button>`).join('');
  const subs = tab.subs.filter(shown);
  selSub(curSub[id] && subs.some(s => s.id === curSub[id]) ? curSub[id] : subs[0].id);
  applySubHits();      // i sotto-tab sono appena stati ricreati
  try { localStorage.setItem('dagawasd_tab', id); } catch(e){}
}

/* ═══ Ricerca impostazioni ═══
   Cerca (senza badare a maiuscole e accenti) in: etichette e descrizioni
   delle impostazioni, titoli dei gruppi, legenda tasti, tabella materiali,
   elenco lingue e nomi di tab/sotto-tab. Evidenzia le righe trovate, i tab
   e sotto-tab che le contengono (col numero di risultati) e il testo nelle
   etichette. Invio passa al riquadro successivo con risultati, Esc svuota.
   Si cerca solo fra ciò che il livello di dettaglio scelto mostra. */
let SEARCH_RAW = '', SEARCH_Q = '', SEARCH_HITS = {}, searchTimer = null;

function norm(s){
  return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}

function onSearchInput(){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(true), 120);   // "tempo reale" senza lavoro a ogni tasto
}

function onSearchKey(e){
  if(e.key === 'Escape'){
    e.target.value = ''; clearTimeout(searchTimer); runSearch(false);
  } else if(e.key === 'Enter'){
    clearTimeout(searchTimer); runSearch(false); gotoNextHit();
  }
}

/* Righe di un riquadro che la ricerca considera, col loro testo. */
function searchItems(pane){
  const items = [];
  pane.querySelectorAll('.row[data-k]').forEach(r => {
    if(+r.dataset.lv > LEVEL) return;
    const g = r.closest('.grp');
    items.push([r, r.textContent + ' ' + (g ? g.querySelector('h3').textContent : '')]);
  });
  pane.querySelectorAll('table.keys tr, .langgrid button').forEach(r => items.push([r, r.textContent]));
  pane.querySelectorAll('#matbody tr').forEach(r => {
    const vals = [...r.querySelectorAll('input')].map(i => i.value).join(' ');
    items.push([r, r.textContent + ' ' + vals]);
  });
  return items;
}

/* Evidenzia la parte trovata nell'etichetta (testo originale in data-orig). */
function markName(row, q){
  const nm = row.querySelector('.lbl .name');
  if(!nm) return;
  const orig = nm.dataset.orig !== undefined ? nm.dataset.orig : (nm.dataset.orig = nm.textContent);
  const n = norm(orig), i = n.indexOf(q);
  // se la normalizzazione cambia la lunghezza, gli indici non combaciano: niente <mark>
  if(i < 0 || n.length !== orig.length){ nm.textContent = orig; return; }
  nm.innerHTML = esc(orig.slice(0, i)) + '<mark>' + esc(orig.slice(i, i + q.length)) + '</mark>'
               + esc(orig.slice(i + q.length));
}

function runSearch(jump){
  const inp = document.getElementById('q');
  SEARCH_RAW = inp ? inp.value : '';
  SEARCH_Q = norm(SEARCH_RAW.trim());
  SEARCH_HITS = {};
  document.querySelectorAll('.hit').forEach(el => el.classList.remove('hit'));
  document.querySelectorAll('.lbl .name[data-orig]').forEach(nm => { nm.textContent = nm.dataset.orig; });
  const cnt = document.getElementById('qcnt');
  if(!SEARCH_Q){
    if(cnt) cnt.textContent = '';
    if(inp) inp.classList.remove('none');
    applyTabHits(); applySubHits();
    return;
  }
  let total = 0;
  SPEC.forEach(t => t.subs.forEach(s => {
    const pane = document.getElementById('pane_' + t.id + '_' + s.id);
    if(!pane || !shown(s)) return;
    let n = 0;
    searchItems(pane).forEach(([el, txt]) => {
      if(norm(txt).includes(SEARCH_Q)){ el.classList.add('hit'); markName(el, SEARCH_Q); n++; }
    });
    // anche il nome del sotto-tab conta come risultato
    SEARCH_HITS[t.id + '/' + s.id] = { n, label: norm(T('sub.' + s.id)).includes(SEARCH_Q) };
    total += n;
  }));
  if(cnt) cnt.textContent = total ? String(total) : T('ui.search_none');
  if(inp) inp.classList.toggle('none', total === 0);
  applyTabHits(); applySubHits();

  if(jump && total){
    // il riquadro aperto non ha risultati: apri il primo che ne ha
    const cur = SEARCH_HITS[curTab + '/' + curSub[curTab]];
    if(!cur || !cur.n) gotoNextHit();
    else scrollToFirstHit();
  }
}

function paneHits(tid, sid){
  const h = SEARCH_HITS[tid + '/' + sid];
  return h ? h.n : 0;
}

function applyTabHits(){
  document.querySelectorAll('#tabs1 button[data-t]').forEach(b => {
    const t = SPEC.find(x => x.id === b.dataset.t);
    const n = SEARCH_Q ? t.subs.reduce((a, s) => a + paneHits(t.id, s.id), 0) : 0;
    const lbl = SEARCH_Q && (norm(b.textContent.replace(/\d+$/, '')).includes(SEARCH_Q) ||
                t.subs.some(s => shown(s) && (SEARCH_HITS[t.id + '/' + s.id] || {}).label));
    b.classList.toggle('hit', !!(n || lbl));
    if(n) b.dataset.n = n; else delete b.dataset.n;
  });
}

function applySubHits(){
  document.querySelectorAll('#tabs2 button').forEach(b => {
    const h = SEARCH_Q ? SEARCH_HITS[curTab + '/' + b.dataset.s] : null;
    b.classList.toggle('hit', !!(h && (h.n || h.label)));
    if(h && h.n) b.dataset.n = h.n; else delete b.dataset.n;
  });
}

function scrollToFirstHit(){
  const p = document.getElementById('pane_' + curTab + '_' + curSub[curTab]);
  const el = p && p.querySelector('.hit');
  if(el) el.scrollIntoView({ block: 'center' });
}

/* Passa al riquadro successivo (in ordine di tab) che ha risultati. */
function gotoNextHit(){
  const order = [];
  SPEC.forEach(t => t.subs.forEach(s => order.push([t.id, s.id])));
  const start = order.findIndex(([t, s]) => t === curTab && s === curSub[curTab]);
  for(let k = 1; k <= order.length; k++){
    const [t, s] = order[(start + k) % order.length];
    if(paneHits(t, s)){
      curSub[t] = s;
      if(t !== curTab) selTab(t); else { selSub(s); applySubHits(); }
      scrollToFirstHit();
      return;
    }
  }
}

function selSub(id){
  curSub[curTab] = id;
  document.querySelectorAll('#tabs2 button').forEach(b =>
    b.classList.toggle('act', b.dataset.s === id));
  document.querySelectorAll('.pane').forEach(p => p.classList.remove('act'));
  const p = document.getElementById('pane_' + curTab + '_' + id);
  if(p) p.classList.add('act');
  if(p && p.querySelector('#hudsvg')) applyLook();   // ora l'anteprima ha una larghezza vera
  try { localStorage.setItem('dagawasd_sub_' + curTab, id); } catch(e){}
}

let LOG_N = 0, LOG_TEXT = '';

function countLog(txt){ return (txt.match(/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d \[/gm) || []).length; }

/* Chiamata da Ruby: {path, text}. Data e ora di ogni voce evidenziate. */

  const fallback = () => {
    const r = document.createRange(), sel = window.getSelection();
    r.selectNodeContents(document.getElementById('logPre'));
    sel.removeAllRanges(); sel.addRange(r);
    try { document.execCommand('copy'); done(); } catch(e){}
    sel.removeAllRanges();
  };
  if(navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(LOG_TEXT).then(done, fallback);
  else fallback();
}

/* ═══ Luogo ═══
   La tendina compila i tre campi; si riallinea da sola al luogo pronto che
   corrisponde ai numeri (vuota se nessuno). */
function placeOf(lat, lon){
  return Object.keys(PLACES).find(p => Math.abs(PLACES[p][0] - lat) < 0.006 &&
    (Math.abs(PLACES[p][0]) === 90 || Math.abs(PLACES[p][1] - lon) < 0.006));
}
function pickPlace(id){
  const p = PLACES[id];
  if(!p) return;
  setNum('sky_lat', p[0]); setNum('sky_lon', p[1]); setNum('sky_tz', p[2]);
  saveNow();
}
function markPlace(){
  const sel = document.getElementById('sky_city');
  if(!sel) return;
  const lat = numVal('sky_lat'), lon = numVal('sky_lon');
  const id = lat === null || lon === null ? null : placeOf(lat, lon);

}

/* ═══ Cielo ═══
   Chiamata da Ruby: {on:false} oppure ora nel cielo (locale del modello),
   luogo, altezza del sole, luna (percentuale illuminata e fase 0–7).
   Date e mesi nella lingua del pannello con Intl. */
let SKY = null;
function skyDate(s, opts){
  try { return new Intl.DateTimeFormat(document.documentElement.lang || 'en', Object.assign({timeZone:'UTC'}, opts))
                 .format(new Date(Date.UTC(s.y, s.mo - 1, s.d, s.h || 0, s.mi || 0))); }
  catch(e){ return s.d + '/' + s.mo; }
}
function monthName(m){ return skyDate({y:2001, mo:m, d:1}, {month:'long'}); }
function setSky(s){
  SKY = s || null;
  const el = document.getElementById('skyStatus');
  if(!el) return;
  const on = !!(SKY && SKY.on);
  el.classList.toggle('on', on);
  if(!on){
    el.textContent = '● ' + T('sky.off') + (SKY && SKY.overlay === false ? ' · ' + T('sky.old') : '');
    return;
  }
  const deg = v => Math.abs(v).toFixed(1).replace(/\.0$/, '');
  const pid = SKY.custom ? placeOf(SKY.lat, SKY.lon) : null;
  const place = (SKY.custom ? (pid && placeName(pid)) : SKY.place) || (deg(SKY.lat) + '° ' + (SKY.lat < 0 ? 'S' : 'N') + ', ' + deg(SKY.lon) + '° ' + (SKY.lon < 0 ? 'W' : 'E'));
  const hm = String(SKY.h).padStart(2, '0') + ':' + String(SKY.mi).padStart(2, '0');
  const sun = T(SKY.sun >= 0 ? 'sky.sun_up' : 'sky.sun_down').replace('{alt}', Math.abs(SKY.sun));
  const moon = T('sky.moon').replace('{phase}', T('sky.ph' + SKY.phase)).replace('{pct}', SKY.moon)
             + (SKY.moon_up ? '' : ' · ' + T('sky.moon_down'));
  el.textContent = '● ' + skyDate(SKY, {day:'numeric', month:'long', year:'numeric'}) + ', ' + hm + ' · ' + place;
  const meta = document.createElement('span');
  meta.className = 'smeta';
  meta.textContent = sun + ' · ' + moon;
  el.appendChild(meta);
}

/* ═══ Lettura / scrittura valori ═══ */
let saveTimer = null;

function decimals(step){
  const s = String(step), i = s.indexOf('.');
  return i < 0 ? 0 : s.length - i - 1;
}

/* Le caselle sono input di testo: con la locale italiana un <input type=number>
   mostra la virgola e rilegge stringa vuota. Qui accettiamo sia '.' che ','. */
function num(v){
  const hm = /^\s*(\d{1,2})[:h](\d{2})\s*$/.exec(String(v));   // ore: 14:30 o 14h30
  if(hm) return +hm[1] + hm[2] / 60;
  const x = parseFloat(String(v).replace(',', '.').trim());
  return isNaN(x) ? null : x;
}

function clampF(k, v){
  const f = FIELDS[k];
  if(!f) return v;
  return Math.min(f.max, Math.max(f.min, v));
}

function fmt(k, v){
  const f = FIELDS[k];
  if(f && f.fmt === 'hm'){        // ore come HH:MM
    const m = Math.round(parseFloat(v) * 60);
    return String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  }
  return f && f.int ? String(Math.round(v)) : parseFloat(v).toFixed(decimals(f ? f.step : 0.01));
}

function sync(sl){            // slider → casella
  const el = document.getElementById(sl.id + '_v');
  if(el) el.value = fmt(sl.id, sl.value);
  markMod(sl.id);
  pairFix(sl.id);
  schedule();
}

/* Coppie [minimo, massimo]: portandone uno oltre l'altro, l'altro lo segue
   (un lancio minimo più forte del massimo farebbe lanciare più piano
   caricando di più). Si applica ai valori confermati: slider, fine
   digitazione, ripristino; mentre si scrive "1" per arrivare a "12" no. */
const PAIRS = [['kick_force_min', 'kick_force'], ['throw_force_min', 'throw_force_max'],
               ['crouch_height', 'eye_height']];
function numVal(k){ const el = document.getElementById(k + '_v'); return el ? num(el.value) : null; }
function setNum(k, v){
  v = clampF(k, v);
  const sl = document.getElementById(k), el = document.getElementById(k + '_v');
  if(sl) sl.value = v;
  if(el) el.value = fmt(k, v);
  markMod(k);
  return v;
}
function pairFix(k){
  PAIRS.forEach(([lo, hi]) => {
    if(k !== lo && k !== hi) return;
    const a = numVal(lo), b = numVal(hi);
    if(a === null || b === null || a <= b) return;
    // l'altro segue; se il suo intervallo non ci arriva, torna indietro quello mosso
    if(k === lo){ if(setNum(hi, a) < a) setNum(lo, numVal(hi)); }
    else        { if(setNum(lo, b) > b) setNum(hi, numVal(lo)); }
  });
}

function sb(inp, key){        // casella → slider
  const v = num(inp.value);
  if(v === null) return;      // digitazione in corso ("", "-", "0,"): non toccare nulla
  const sl = document.getElementById(key);
  if(sl) sl.value = clampF(key, v);
  markMod(key);
  schedule();
}

/* A fine digitazione riallinea la casella al valore effettivo (clamp + formato). */
function fix(key){
  const el = document.getElementById(key + '_v');
  const sl = document.getElementById(key);
  if(!el) return;
  let v = num(el.value);
  if(v === null) v = DEF[key] !== undefined ? DEF[key] : +(sl ? sl.value : 0);
  v = clampF(key, v);
  if(FIELDS[key].int) v = Math.round(v);
  el.value = fmt(key, v);
  if(sl) sl.value = v;
  markMod(key);
  pairFix(key);
  saveNow();
}

function live(k){ markMod(k); saveNow(); }

/* ═══ Valori modificati ═══
   Pallino e ↺ sulle righe diverse dal predefinito; sullo switch dei livelli
   un pallino segnala modifiche nascoste dal livello attuale. */
function valueMod(k){
  if(DEF[k] === undefined) return false;
  if(STR_KEYS.includes(k)){
    const v = strVal(k);
    return v !== undefined && v !== DEF[k];
  }
  if(FIELDS[k].type === 'bool'){
    const el = document.getElementById(k);
    return !!el && el.checked !== !!DEF[k];
  }
  const el = document.getElementById(k + '_v');
  const v = el ? num(el.value) : null;
  return v !== null && fmt(k, clampF(k, v)) !== fmt(k, DEF[k]);
}
function markRow(k){
  const r = document.querySelector(`.row[data-k="${k}"]`);
  if(r) r.classList.toggle('mod', valueMod(k));
}
function markMod(k){ markRow(k); markUnit(k); markLevelMods(); markDeps(); if(LOOK_KEYS.includes(k)) applyLook(); }
function refreshModified(){ Object.keys(FIELDS).forEach(k => { markRow(k); markUnit(k); }); markLevelMods(); markDeps(); applyLook(); }
/* Unità che dipende dal valore: il nome del mese accanto al numero */
function markUnit(k){
  if(k === 'sky_lat' || k === 'sky_lon' || k === 'sky_tz') markPlace();
  const f = FIELDS[k];
  if(!f || f.uname !== 'month') return;
  const v = numVal(k), u = document.querySelector(`.row[data-k="${k}"] .unit`);
  if(u) u.textContent = v === null ? '' : monthName(Math.min(12, Math.max(1, Math.round(v))));
}
// Campi che valgono solo con un interruttore acceso: riga attenuata se
// l'interruttore, o quello da cui dipende a sua volta, è spento.
function depOn(k){
  const f = FIELDS[k];
  if(!f || !f.dep) return true;
  // acceso = interruttore acceso o scelta diversa da 'none'; finché i valori
  // non sono arrivati (undefined) la riga resta normale
  return [].concat(f.dep).every(d => {
    const neg = d[0] === '!', k = neg ? d.slice(1) : d, v = lookVal(k);
    if(v === undefined) return true;
    const on = v === true || (typeof v === 'string' && v !== 'none');
    return neg ? !on : on && depOn(k);
  });
}
function markDeps(){
  if(!READY) return;   // prima di loadSettings le caselle sono tutte spente
  Object.values(FIELDS).filter(f => f.dep).forEach(f => {
    const row = document.querySelector(`.row[data-k="${f.k}"]`);
    if(row) row.classList.toggle('off', !depOn(f.k));
  });
}
function markLevelMods(){
  const lvs = Object.keys(FIELDS).filter(valueMod).map(k => FIELDS[k].lv);
  if(KEY_ACTS.some(keyMod)) lvs.push(1);
  document.querySelectorAll('#lvsw button').forEach(b => {
    const n = +b.dataset.lvl;
    const hid = n > LEVEL && lvs.some(x => x > LEVEL && x <= n);
    b.classList.toggle('mod', hid);
    b.title = T('lvl.h' + n) + (hid ? '\n' + T('lvl.hidden_mod') : '');
  });
}
function resetOne(k){
  if(DEF[k] === undefined) return;
  loadSettings({ [k]: DEF[k] });
  pairFix(k);
  saveNow();
}

/* ═══ Colori e scelte ═══
   Il colore vale quanto scritto nella casella esadecimale; mentre si
   digita un valore non valido vale l'ultimo buono, rimasto nel selettore. */
function normHex(s){
  s = String(s || '').trim().toLowerCase();
  if(s[0] !== '#') s = '#' + s;
  if(/^#[0-9a-f]{3}$/.test(s)) s = '#' + s.slice(1).split('').map(c => c + c).join('');
  return /^#[0-9a-f]{6}$/.test(s) ? s : null;
}
function strVal(k){
  const f = FIELDS[k];
  if(f.type === 'color'){
    const el = document.getElementById(k + '_v'), pk = document.getElementById(k);
    if(!el) return undefined;
    return normHex(el.value) || (READY && pk ? pk.value : undefined);
  }
  const el = document.getElementById(k);
  return el && choiceVals(f).includes(el.value) ? el.value : undefined;
}
function setStr(k, v){
  const el = document.getElementById(k);
  if(!el) return;
  if(FIELDS[k].type === 'color'){
    const n = normHex(v);
    if(!n) return;
    const box = document.getElementById(k + '_v');
    el.value = n; box.value = n; box.classList.remove('bad');
  } else {
    el.value = v;
    if(el.value !== v) el.selectedIndex = -1;
  }
}
function colorPick(k){
  document.getElementById(k + '_v').value = document.getElementById(k).value;
  document.getElementById(k + '_v').classList.remove('bad');
  markMod(k); schedule();
}
function hexIn(k){
  const box = document.getElementById(k + '_v'), n = normHex(box.value);
  box.classList.toggle('bad', !n);
  if(!n) return;                          // digitazione in corso
  document.getElementById(k).value = n;
  markMod(k); schedule();
}
function fixHex(k){
  const box = document.getElementById(k + '_v'), pk = document.getElementById(k);
  const n = normHex(box.value) || pk.value;
  box.value = n; pk.value = n; box.classList.remove('bad');
  markMod(k); saveNow();
}
/* "Ripristina aspetto": solo i campi del sotto-tab Aspetto */
function resetLook(){
  const d = {};
  LOOK_KEYS.forEach(k => { if(DEF[k] !== undefined) d[k] = DEF[k]; });
  loadSettings(d); saveNow();
}

/* ═══ Aspetto ═══
   Trasforma le impostazioni ui_* in variabili CSS e classi del <body>, e
   hud_* nell'anteprima del mirino. I neutri stanno fra sfondo e testo del
   tema (NEUTRALS); accento, evidenziazione e colore di stop si scuriscono
   o schiariscono per restare leggibili su sfondi chiari. Prima che Ruby
   mandi i valori si usano quelli dell'ultima volta (localStorage): così
   il pannello non si apre per un istante col tema predefinito. */
let LOOK_CACHE = {};
function rgb(h){ const n = normHex(h); return n ? [1, 3, 5].map(i => parseInt(n.slice(i, i + 2), 16)) : null; }
function hex(c){ return '#' + c.map(x => Math.round(Math.min(255, Math.max(0, x))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t){ return a.map((x, i) => x + (b[i] - x) * t); }
function lum(c){ return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }
function rgba(c, a){ return `rgba(${c.map(Math.round).join(',')},${a})`; }
const WHITE = [255, 255, 255], BLACK = [0, 0, 0];

function lookVal(k){
  const f = FIELDS[k];
  let v;
  if(STR_KEYS.includes(k)) v = strVal(k);
  else if(f.type === 'bool'){
    const el = document.getElementById(k);
    v = READY && el ? el.checked : undefined;   // prima di loadSettings le caselle sono tutte spente
  } else {
    const el = document.getElementById(k + '_v'), x = el ? num(el.value) : null;
    v = x === null ? undefined : clampF(k, x);
  }
  if(v === undefined) v = LOOK_CACHE[k];
  if(v === undefined) v = DEF[k];
  return v;
}
function systemLight(){
  try { return window.matchMedia('(prefers-color-scheme: light)').matches; } catch(e){ return false; }
}

function applyLook(){
  const v = {};
  LOOK_KEYS.forEach(k => { v[k] = lookVal(k); });
  if(LOOK_KEYS.some(k => v[k] === undefined)) return;   // niente valori: resta il CSS di base
  LOOK_CACHE = v;
  try { localStorage.setItem('dagawasd_look', JSON.stringify(v)); } catch(e){}
  const r = document.documentElement.style, b = document.body;
  const th = THEMES[v.ui_theme === 'auto' ? (systemLight() ? 'light' : 'dark') : v.ui_theme] || THEMES.dark;
  const custom = v.ui_custom_colors && rgb(v.ui_bg) && rgb(v.ui_text);
  const B = rgb(custom ? v.ui_bg : th.bg), F = rgb(custom ? v.ui_text : th.fg);
  const light = lum(B) > lum(F);
  const set = (n, c) => r.setProperty('--' + n, typeof c === 'string' ? c : hex(c));
  for(const n in NEUTRALS) set(n, mix(B, F, th.boost && BOOST[n] ? BOOST[n] : NEUTRALS[n]));
  set('edge', rgba(F, .14));
  r.setProperty('color-scheme', light ? 'light' : 'dark');   // tendine e selettori di sistema

  const A = rgb(v.ui_accent), H = rgb(v.ui_highlight), D = rgb(v.ui_danger);
  set('acc', A); set('acc-hi', mix(A, light ? BLACK : WHITE, .12));
  set('acc-ink', lum(A) > .45 ? '#0d0d0d' : '#ffffff');
  set('acc-bg', mix(B, A, light ? .16 : .2)); set('acc-deep', mix(A, BLACK, .4));
  set('acc-tx', light ? mix(A, F, .35) : A); set('acc-tx2', mix(A, B, .2));
  set('knob', lum(A) > .8 ? '#0d0d0d' : '#ffffff');
  set('hl', H); set('hl-tx', light ? mix(H, F, .45) : H);
  set('hl-ink', lum(H) > .45 ? '#111111' : '#ffffff');
  set('hl-soft', rgba(H, light ? .2 : .09)); set('hl-line', rgba(H, .45));
  set('hl-bg', mix(B, H, .1)); set('hl-bg2', mix(B, H, .16)); set('hl-edge', mix(B, H, .38));
  set('dg', D); set('dg-hi', mix(D, WHITE, .1)); set('dg-ink', lum(D) > .5 ? '#111111' : '#ffffff');
  set('dg-bg', mix(B, D, .18)); set('dg-tx', light ? mix(D, F, .2) : mix(D, WHITE, .4)); set('dg-edge', mix(B, D, .6));

  set('font', FONT_STACK[v.ui_font] || FONT_STACK.segoe);
  set('fs', v.ui_font_size + 'px'); set('lh', String(v.ui_line_height));
  set('rk', String(v.ui_radius / 6)); set('sp', String(v.ui_spacing));
  set('lblw', v.ui_label_width + 'px'); set('sbw', v.ui_scrollbar + 'px');
  b.classList.toggle('noanim', !v.ui_animations);
  b.classList.toggle('nohints', !v.ui_hints);
  ['text', 'both', 'icons'].forEach(m => b.classList.toggle('ti-' + m, v.ui_tab_icons === m));
  const logo = document.getElementById('logo');
  if(logo) logo.textContent = LOGOS[v.ui_logo] || '';
  renderHudPreview(v);
}

/* Anteprima 1:1 di mirino e barra di carica, con le stesse misure che
   usa lib/tool.rb (barra al 62 %, zona di topspin al 90 %). */
function renderHudPreview(v){
  const svg = document.getElementById('hudsvg');
  if(!svg || v.hud_cross_size === undefined) return;
  const W = svg.clientWidth || 340, cx = Math.round(W / 2) + .5, cy = 46.5;
  const sz = v.hud_cross_size, lw = v.hud_cross_width, op = v.hud_cross_opacity, st = v.hud_cross_style;
  const g = Math.min(v.hud_cross_gap, sz - 1, 12);
  const col = normHex(v.hud_cross_color) || '#ffffff';
  const dotR = st === 'dot' ? Math.max(sz / 3, 1.5) : lw + .5;
  const shape = (c, w, o) => {
    let s = '';
    if(st === 'cross' || st === 'crossdot')
      s += `<path d="M${cx - sz} ${cy}H${cx - g}M${cx + g} ${cy}H${cx + sz}M${cx} ${cy - sz}V${cy - g}M${cx} ${cy + g}V${cy + sz}"
              stroke="${c}" stroke-width="${w}" stroke-opacity="${o}" fill="none"/>`;
    if(st === 'circle') s += `<circle cx="${cx}" cy="${cy}" r="${sz}" stroke="${c}" stroke-width="${w}" stroke-opacity="${o}" fill="none"/>`;
    if(st === 'dot' || st === 'crossdot') s += `<circle cx="${cx}" cy="${cy}" r="${dotR + (w - lw) / 2}" fill="${c}" fill-opacity="${o}"/>`;
    return s;
  };
  let s = '';
  if(v.hud_cross_outline) s += shape('#000', lw + 2, (op * 150 / 255).toFixed(3));
  s += shape(col, lw, op);
  const bw = v.hud_bar_width, bh = v.hud_bar_height, x0 = cx - bw / 2, y0 = cy + Math.max(26, sz + 14);
  s += `<rect x="${x0 - 1}" y="${y0}" width="${bw + 2}" height="${bh}" fill="#000" fill-opacity=".43"/>`
     + `<rect x="${x0}" y="${y0}" width="${bw * .62}" height="${bh}" fill="${normHex(v.hud_bar_color) || '#fff'}" fill-opacity=".86"/>`
     + `<path d="M${x0 + bw * .9} ${y0 - 3}V${y0 + bh + 3}" stroke="${normHex(v.hud_bar_zone_color) || '#ffb428'}" stroke-width="1"/>`;
  svg.innerHTML = s;
}

/* ═══ Barra in basso ═══
   Priorità: messaggio lampo (importato, tasto riservato…) → spiegazione
   dell'impostazione sotto il mouse → stato normale ("si applicano subito"). */
let STATUS = '', INFO_K = null, FLASH = null, flashTimer = null, statusTimer = null;
function renderStatus(){
  const el = document.getElementById('status');
  if(!el) return;
  el.classList.toggle('flash', !!FLASH);
  el.classList.toggle('info', !FLASH && !!INFO_K);
  if(FLASH) el.textContent = FLASH;
  else if(INFO_K) el.innerHTML = infoHTML(INFO_K);
  else el.textContent = STATUS;
}
function flashStatus(t){
  FLASH = t; renderStatus();
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { FLASH = null; renderStatus(); }, 1800);
}
function setInfo(k){
  if(INFO_K === k) return;
  INFO_K = k; renderStatus();
}
/* Spiegazione lunga (d.*) se c'è, altrimenti la descrizione breve (h.*);
   poi intervallo e valore predefinito. */
function infoHTML(k){
  const f = FIELDS[k];
  const txt = has('d.' + k) ? T('d.' + k) : (has('h.' + k) ? T('h.' + k) : '');
  const u = f.u && !f.u.includes('–') ? ' ' + f.u : '';     // "0–1" è già un intervallo
  const meta = [];
  if(!f.type) meta.push(`${T('ui.range')}: ${fmt(k, f.min)} – ${fmt(k, f.max)}${u}`);
  if(DEF[k] !== undefined)
    meta.push(`${T('ui.default')}: ` + (f.type === 'bool' ? T(DEF[k] ? 'ui.on' : 'ui.off')
      : f.type === 'choice' ? choiceLabel(f, DEF[k]) : f.type === 'color' ? DEF[k] : fmt(k, DEF[k]) + u));
  return `<b>${esc(T('f.' + k))}</b>` + (txt ? ` — ${esc(txt)}` : '')
       + (meta.length ? `<span class="meta">${esc(meta.join(' · '))}</span>` : '');
}

function schedule(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 300);
}

function collect(){
  const out = {};
  for(const k of NUM_KEYS){
    const el = document.getElementById(k + '_v') || document.getElementById(k);
    if(!el) continue;
    let v = num(el.value);
    if(v === null) v = DEF[k];
    if(v === undefined) continue;     // casella vuota e default non ancora arrivati
    v = clampF(k, v);
    out[k] = FIELDS[k].int ? Math.round(v) : v;
  }
  for(const k of BOOL_KEYS){
    const el = document.getElementById(k);
    if(el) out[k] = el.checked;
  }
  for(const k of STR_KEYS){
    const v = strVal(k) !== undefined ? strVal(k) : DEF[k];
    if(v !== undefined) out[k] = v;
  }
  out.panel_level = LEVEL;
  if(Object.keys(KEYS).length){ out.keys = KEYS; out.key_labels = KEY_LBL; }
  if(MATS.length) out.materials = MATS;   // prima che Ruby la invii è vuota: non sovrascrivere
  return out;
}

/* READY: il modulo contiene i valori veri. build() lo azzera (caselle vuote,
   interruttori spenti) finché Ruby non manda loadSettings: salvare prima
   manderebbe tutti gli interruttori a false, sovrascrivendo le impostazioni. */
let READY = false;

function saveNow(){
  clearTimeout(saveTimer);
  if(!READY) return;
  sketchup.save_settings(JSON.stringify(collect()));
  STATUS = T('ui.saved'); renderStatus();
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { STATUS = T('ui.autosave'); renderStatus(); }, 1200);
}

function loadSettings(s){
  for(const k of NUM_KEYS){
    if(s[k] === undefined) continue;
    const sl = document.getElementById(k), el = document.getElementById(k + '_v');
    if(sl) sl.value = s[k];
    if(el) el.value = fmt(k, s[k]);
  }
  for(const k of BOOL_KEYS){
    const el = document.getElementById(k);
    if(el && s[k] !== undefined) el.checked = !!s[k];
  }
  for(const k of STR_KEYS){
    if(s[k] !== undefined) setStr(k, s[k]);
  }
  if(Array.isArray(s.materials)){
    MATS = s.materials.map(r => Object.assign({}, r));
    renderMaterials();
  }
  if(s.keys && typeof s.keys === 'object'){
    KEYS = Object.assign({}, s.keys);
    KEY_LBL = Object.assign({}, s.key_labels || {});
    renderKeys();
  }
  if(s.panel_level !== undefined && +s.panel_level !== LEVEL) setLevel(s.panel_level, false);
  refreshModified();
  READY = true;
  markDeps();
}

/* Ripristina i valori delle impostazioni; lingua, livello e tasti restano
   (i tasti hanno il loro pulsante nella legenda Comandi). */
function resetAll(){
  const d = {};
  Object.keys(FIELDS).forEach(k => { if(DEF[k] !== undefined) d[k] = DEF[k]; });
  loadSettings(d); saveNow(); sketchup.reset_materials();
}

function setRunning(on){
  const btn = document.getElementById('btnT'), dot = document.getElementById('dot');
  if(on){
    btn.textContent = '⏹ ' + T('ui.stop');  btn.className = 'btn btn-stop';
    dot.textContent = '● ' + T('ui.active'); dot.className = 'dot on';
  } else {
    btn.textContent = '▶ ' + T('ui.start');  btn.className = 'btn btn-go';
    dot.textContent = '● ' + T('ui.idle');   dot.className = 'dot';
  }
}

window.onload = () => {
  try { curTab = localStorage.getItem('dagawasd_tab'); } catch(e){}
  // livello dell'ultima sessione, per non far "saltare" il pannello prima che
  // Ruby mandi quello salvato nelle impostazioni
  try { const lv = +localStorage.getItem('dagawasd_lvl'); if(LEVELS.includes(lv)) LEVEL = lv; } catch(e){}
  document.body.dataset.lv = LEVEL;
  try { LOOK_CACHE = JSON.parse(localStorage.getItem('dagawasd_look')) || {}; } catch(e){}
  SPEC.forEach(x => {
    try {
      const s = localStorage.getItem('dagawasd_sub_' + x.id);
      if(x.subs.some(y => y.id === s)) curSub[x.id] = s;
    } catch(e){}
  });
  build();
  selTab(curTab && SPEC.some(t => t.id === curTab) ? curTab : SPEC[0].id);
  // spiegazioni nella barra in basso: #content resta, cambia solo il suo contenuto
  const c = document.getElementById('content');
  const rowOf = e => { const r = e.target.closest && e.target.closest('.row[data-k]'); return r ? r.dataset.k : null; };
  c.addEventListener('mouseover', e => setInfo(rowOf(e)));
  c.addEventListener('mouseleave', () => setInfo(null));
  c.addEventListener('focusin', e => { const k = rowOf(e); if(k) setInfo(k); });
  // tema automatico: segue il cambio chiaro/scuro di Windows
  try { window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyLook); } catch(e){}
  window.addEventListener('resize', () => renderHudPreview(LOOK_CACHE));
  sketchup.request_settings();   // Ruby risponde con applyLang + loadSettings + setRunning
};
</script>
